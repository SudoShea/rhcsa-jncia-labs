# ==============================================================================
# File        : .github/workflows/lint.yml
# Description : GitHub Actions CI workflow utilising Node.js 24 LTS runtime
# Author      : SudoShea
# Version     : 1.0.0
# Licence     : MIT
# ==============================================================================
name: CI Quality Gates

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  quality-gates:
    name: Code & Infrastructure Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24 Environment
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install Node-Based Linters & Formatter
        run: |
          npm install -g markdownlint-cli htmlhint prettier

      - name: Verify Node.js & Tool Versions
        run: |
          node --version
          npm --version
          htmlhint --version
          prettier --version

      # ------------------------------------------------------------------------
      # 1. Shell Script Security & Syntax Analysis
      # ------------------------------------------------------------------------
      - name: Install and Run ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          echo "[INFO] Running ShellCheck on executable shell scripts..."
          find . -type f -name "*.sh" -exec shellcheck -e SC1091 {} +

      # ------------------------------------------------------------------------
      # 2. YAML & Ansible Syntax Validation
      # ------------------------------------------------------------------------
      - name: Set up Python for YAML/Ansible Linting
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Yamllint & Ansible-Lint
        run: |
          python -m pip install --upgrade pip
          pip install yamllint ansible-lint

      - name: Run Yamllint
        run: |
          yamllint -d "{extends: relaxed, rules: {line-length: disable}}" .
